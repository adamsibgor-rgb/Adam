<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prodaja 3D kazalnikov za knjige</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f4f4; text-align: center; }
        header { background-color: #333; color: white; padding: 20px 0; }
        nav a { color: white; margin: 0 15px; text-decoration: none; font-weight: bold; }
        .container { padding: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; max-width: 1000px; margin: 0 auto; }
        .card { background: white; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); padding: 15px; text-align: center; }
        .card img { max-width: 100%; height: 200px; object-fit: cover; border-radius: 5px; }
        .card h3 { margin: 10px 0 5px; font-size: 1.1em; }
        .card p { color: #555; font-weight: bold; font-size: 1.1em; margin: 5px 0 15px; }
        .btn-add { background-color: #28a745; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-size: 1em; }
        .btn-add:hover { background-color: #218838; }

        /* Košarica */
        .cart-section { max-width: 600px; margin: 40px auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .cart-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #eee; }
        .checkout-btn { background-color: #007bff; color: white; border: none; padding: 12px 20px; border-radius: 5px; cursor: pointer; font-size: 1.1em; margin-top: 15px; width: 100%; }
        .checkout-btn:hover { background-color: #0069d9; }
    </style>
</head>
<body>

    <header>
        <h1>3D Kazalke za Knjige</h1>
        <nav>
            <a href="index.html">Domov</a>
            <a href="kazalke.html">Kazalke</a>
        </nav>
    </header>

    <div class="container">
        <h2>Izberite svojo kazalko</h2>
        <br>
        <div id="product-grid" class="grid">
            <p>Nalaganje izdelkov iz baze...</p>
        </div>
    </div>

    <div class="cart-section">
        <h2>Nakupovalna košarica</h2>
        <div id="cart-items">
            <p style="color: #777;">Košarica je prazna.</p>
        </div>
        <h3 style="margin-top: 15px; text-align: right;">Skupaj: <span id="cart-total">0.00 €</span></h3>
        <button class="checkout-btn" onclick="checkout()">Zaključi nakup</button>
    </div>

    <script>
        const SUPABASE_URL = 'https://uvzphptvnscphptmvyuq.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_d9Nfy7-esxlS9_8Uxm_iYw_drUfUDky';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let allProducts = [];
        let cart = [];

        async function fetchProducts() {
            const { data, error } = await supabaseClient.from('products').select('*');
            if (error) {
                console.error('Napaka pri nalaganju:', error);
                document.getElementById('product-grid').innerHTML = '<p>Napaka pri nalaganju izdelkov.</p>';
                return;
            }
            allProducts = data;
            renderProducts(allProducts);
        }

        function renderProducts(products) {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '';
            if (products.length === 0) {
                grid.innerHTML = '<p>Trenutno ni izdelkov v bazi.</p>';
                return;
            }
            products.forEach(p => {
                grid.innerHTML += `
                    <div class="card">
                        <img src="${p.img}" alt="${p.name}" onerror="this.src='https://via.placeholder.com/200?text=Slika+ni+na+voljo'">
                        <h3>${p.name}</h3>
                        <p>${p.price.toFixed(2)} €</p>
                        <button class="btn-add" onclick="addToCart('${p.id}')">Dodaj v košarico</button>
                    </div>
                `;
            });
        }

        function addToCart(id) {
            const product = allProducts.find(p => p.id === id);
            if (product) {
                cart.push(product);
                updateCart();
            }
        }

        function updateCart() {
            const cartContainer = document.getElementById('cart-items');
            const totalContainer = document.getElementById('cart-total');
            if (cart.length === 0) {
                cartContainer.innerHTML = '<p style="color: #777;">Košarica je prazna.</p>';
                totalContainer.innerText = '0.00 €';
                return;
            }
            cartContainer.innerHTML = '';
            let total = 0;
            cart.forEach((item) => {
                total += item.price;
                cartContainer.innerHTML += `
                    <div class="cart-item">
                        <span>${item.name}</span>
                        <span><b>${item.price.toFixed(2)} €</b></span>
                    </div>
                `;
            });
            totalContainer.innerText = total.toFixed(2) + ' €';
        }

        function checkout() {
            if (cart.length === 0) {
                alert('Vaša košarica je prazna!');
                return;
            }
            alert('Hvala za naročilo!');
        }

        fetchProducts();
    </script>
</body>
</html>
