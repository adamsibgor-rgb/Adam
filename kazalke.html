<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Kazalke | 3Dprojekti</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 0; 
            padding: 20px; 
            background-color: #fdfbf7; 
            color: #2d5a27;
            text-align: center; 
        }

        h1 { color: #2d5a27; margin-bottom: 15px; }

        .category-filters {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .filter-btn {
            background-color: #e3d5b5;
            color: #2d5a27;
            border: 2px solid #2d5a27;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            text-transform: capitalize;
            transition: all 0.2s;
        }

        .filter-btn.active, .filter-btn:hover {
            background-color: #2d5a27;
            color: white;
        }

        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); 
            gap: 20px; 
            max-width: 900px; 
            margin: 0 auto; 
        }

        .card { 
            background-color: #e3d5b5; 
            border: 2px solid #2d5a27; 
            border-radius: 18px; 
            padding: 15px; 
            text-align: center; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .img-container {
            background-color: #ffffff;
            border-radius: 12px;
            padding: 10px;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card img { 
            max-width: 100%; 
            height: 180px; 
            object-fit: contain; 
            border-radius: 6px; 
        }

        .card h3 { 
            margin: 5px 0; 
            color: #2d5a27; 
            font-size: 1.2rem;
        }

        .card p { 
            color: #2d5a27; 
            font-weight: bold; 
            font-size: 1.1rem; 
            margin: 5px 0 12px 0; 
        }

        /* Upravljanje količine */
        .qty-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
        }

        .qty-btn {
            background-color: #2d5a27;
            color: white;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 6px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .qty-btn:hover { background-color: #1e3d1a; }

        .qty-count {
            font-weight: bold;
            font-size: 1.1rem;
            min-width: 24px;
            color: #2d5a27;
        }

        .cart-section { 
            max-width: 600px; 
            margin: 40px auto 0 auto; 
            background-color: #e3d5b5; 
            border: 2px solid #2d5a27; 
            border-radius: 18px; 
            padding: 20px; 
            text-align: left;
        }

        .cart-section h2 { 
            text-align: center; 
            margin-top: 0; 
            color: #2d5a27;
        }

        .cart-item { 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            padding: 8px 0; 
            border-bottom: 1px solid #c8b998; 
            color: #2d5a27;
        }

        .discount-note {
            color: #2d5a27;
            font-weight: bold;
            font-size: 0.95rem;
            margin-top: 10px;
            text-align: right;
        }

        .checkout-btn { 
            background-color: #2d5a27; 
            color: white; 
            border: none; 
            padding: 12px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 1.1em; 
            font-weight: bold;
            margin-top: 15px; 
            width: 100%; 
        }

        .checkout-btn:hover { background-color: #1e3d1a; }
    </style>
</head>
<body>

    <h1>Katalog Kazalk</h1>

    <div id="category-filters" class="category-filters"></div>

    <div id="product-grid" class="grid">
        <p>Nalaganje kazalk...</p>
    </div>

    <div class="cart-section">
        <h2>Košarica</h2>
        <div id="cart-items">
            <p style="color: #666; text-align: center;">Košarica je prazna.</p>
        </div>
        <div id="discount-info" class="discount-note"></div>
        <h3 style="margin-top: 15px; text-align: right; color: #2d5a27;">Skupaj: <span id="cart-total">0.00 €</span></h3>
        <button class="checkout-btn" onclick="checkout()">Zaključi nakup</button>
    </div>

    <script>
        const SUPABASE_URL = 'https://uvzphptvnscphptmvyuq.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_d9Nfy7-esxlS9_8Uxm_iYw_drUfUDky';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let allProducts = [];
        let cart = {}; // Struktura: { 'id_izdelka': kolicina }

        async function fetchProducts() {
            const { data, error } = await supabaseClient.from('products').select('*');
            if (error) {
                console.error('Napaka pri nalaganju:', error);
                document.getElementById('product-grid').innerHTML = '<p>Napaka pri nalaganju izdelkov.</p>';
                return;
            }

            allProducts = data.map(p => ({
                ...p,
                price: (p.price && p.price > 0) ? p.price : 7.00
            }));

            buildCategoryFilters();
            renderProducts(allProducts);
        }

        function buildCategoryFilters() {
            const filterContainer = document.getElementById('category-filters');
            const categories = ['Vse', ...new Set(allProducts.map(p => p.category).filter(Boolean))];

            filterContainer.innerHTML = '';
            categories.forEach((cat, index) => {
                const btn = document.createElement('button');
                btn.className = `filter-btn ${index === 0 ? 'active' : ''}`;
                btn.innerText = cat;
                btn.onclick = (e) => filterCategory(cat, e.target);
                filterContainer.appendChild(btn);
            });
        }

        function filterCategory(category, btnElement) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btnElement.classList.add('active');

            if (category === 'Vse') {
                renderProducts(allProducts);
            } else {
                const filtered = allProducts.filter(p => p.category === category);
                renderProducts(filtered);
            }
        }

        function renderProducts(products) {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '';
            if (products.length === 0) {
                grid.innerHTML = '<p>Trenutno ni izdelkov v tej kategoriji.</p>';
                return;
            }
            products.forEach(p => {
                const qty = cart[p.id] || 0;
                grid.innerHTML += `
                    <div class="card">
                        <div class="img-container">
                            <img src="${p.img}" alt="${p.name}" onerror="this.src='https://via.placeholder.com/200?text=Slika+ni+na+voljo'">
                        </div>
                        <h3>${p.name}</h3>
                        <p>${p.price.toFixed(2)} €</p>
                        <div class="qty-controls">
                            <button class="qty-btn" onclick="changeQty('${p.id}', -1)">-</button>
                            <span class="qty-count" id="qty-${p.id}">${qty}</span>
                            <button class="qty-btn" onclick="changeQty('${p.id}', 1)">+</button>
                        </div>
                    </div>
                `;
            });
        }

        function changeQty(id, delta) {
            const current = cart[id] || 0;
            const updated = current + delta;

            if (updated > 0) {
                cart[id] = updated;
            } else {
                delete cart[id];
            }

            // Posodobi števec na kartici izdelka
            const qtyElement = document.getElementById(`qty-${id}`);
            if (qtyElement) {
                qtyElement.innerText = cart[id] || 0;
            }

            updateCart();
        }

        function updateCart() {
            const cartContainer = document.getElementById('cart-items');
            const totalContainer = document.getElementById('cart-total');
            const discountInfo = document.getElementById('discount-info');

            const itemIds = Object.keys(cart);

            if (itemIds.length === 0) {
                cartContainer.innerHTML = '<p style="color: #666; text-align: center;">Košarica je prazna.</p>';
                totalContainer.innerText = '0.00 €';
                discountInfo.innerText = '';
                return;
            }

            cartContainer.innerHTML = '';

            let bookmarkCount = 0;
            let otherTotal = 0;

            itemIds.forEach(id => {
                const product = allProducts.find(p => p.id === id);
                if (!product) return;

                const qty = cart[id];

                if (product.category === 'vaze') {
                    otherTotal += product.price * qty;
                } else {
                    bookmarkCount += qty;
                }

                cartContainer.innerHTML += `
                    <div class="cart-item">
                        <div>
                            <b>${product.name}</b>
                            <br>
                            <small>${qty}x (${product.price.toFixed(2)} €/kos)</small>
                        </div>
                        <div class="qty-controls" style="width: auto;">
                            <button class="qty-btn" onclick="changeQty('${product.id}', -1)">-</button>
                            <span class="qty-count">${qty}</span>
                            <button class="qty-btn" onclick="changeQty('${product.id}', 1)">+</button>
                        </div>
                    </div>
                `;
            });

            // Odstotkovni popust za kazalke
            let discountPercent = 0;
            if (bookmarkCount === 2) discountPercent = 10;
            else if (bookmarkCount === 3) discountPercent = 20;
            else if (bookmarkCount === 4) discountPercent = 30;
            else if (bookmarkCount >= 5) discountPercent = 40;

            let bookmarkBaseTotal = bookmarkCount * 7.00;
            let bookmarkTotal = bookmarkBaseTotal * (1 - discountPercent / 100);

            if (discountPercent > 0) {
                discountInfo.innerText = `Upoštevan ${discountPercent}% popust na ${bookmarkCount} kazalk!`;
            } else {
                discountInfo.innerText = '';
            }

            const total = bookmarkTotal + otherTotal;
            totalContainer.innerText = total.toFixed(2) + ' €';
        }

        function checkout() {
            if (Object.keys(cart).length === 0) {
                alert('Vaša košarica je prazna!');
                return;
            }
            alert('Hvala za naročilo!');
        }

        fetchProducts();
    </script>
</body>
</html>
