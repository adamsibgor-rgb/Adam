<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog 3D Kazalk - 3Dprojekti</title>
    <!-- Supabase JavaScript client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #FFF8EC; /* Usklajeno z glavno stranjo */
            color: #546B41;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Gumb za vrnitev na glavno stran */
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background-color: #546B41;
            color: white;
            padding: 10px 18px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.95rem;
            transition: background 0.2s, transform 0.2s;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
        }
        .back-btn:hover {
            background-color: #435433;
            transform: translateY(-2px);
        }

        h1 {
            color: #2C3E1F;
            margin-top: 20px;
        }
        .filters {
            margin: 20px 0;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .filter-btn {
            background-color: #546B41;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }
        .filter-btn:hover, .filter-btn.active {
            background-color: #2C3E1F;
        }
        #product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1000px;
            margin-bottom: 30px;
        }
        .product-card {
            background: white;
            border-radius: 15px;
            padding: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            text-align: center;
            cursor: pointer;
            border: 3px solid transparent;
            transition: transform 0.2s, border-color 0.2s;
        }
        .product-card:hover {
            transform: translateY(-3px);
        }
        .product-card.selected {
            border-color: #546B41;
            background-color: #f4f7f2;
        }
        .product-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 10px;
        }
        .order-box {
            background: #DCCCAC; /* Usklajeno z barvo kartic iz prve strani */
            border: 3px solid #546B41;
            padding: 20px;
            border-radius: 20px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            text-align: center;
        }
        input[type="text"], input[type="email"] {
            width: 80%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #546B41;
            margin: 8px 0;
            background-color: white;
        }
        button.order-btn {
            background-color: #546B41;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        button.order-btn:hover {
            background-color: #2C3E1F;
        }
        .discount-info {
            background: #DCCCAC;
            border: 2px dashed #546B41;
            padding: 12px;
            border-radius: 15px;
            margin-bottom: 20px;
            max-width: 600px;
            text-align: center;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <!-- Gumb za vrnitev na glavno stran -->
    <a href="index.html" class="back-btn">← Nazaj na glavno stran</a>

    <h1>Katalog 3D Kazalk</h1>

    <div class="discount-info">
        🏷️ <strong>Količinski popusti</strong><br>
        1x = 7,00 € &nbsp;|&nbsp; 2x = 12,00 € &nbsp;|&nbsp; 3x = 16,00 € &nbsp;|&nbsp; 5x = 24,00 €
    </div>

    <!-- Gumbi za kategorije -->
    <div class="filters">
        <button class="filter-btn active" onclick="filterCategory('vse', event)">Vse</button>
        <button class="filter-btn" onclick="filterCategory('kužki', event)">Psi</button>
        <button class="filter-btn" onclick="filterCategory('mačke', event)">Mačke</button>
        <button class="filter-btn" onclick="filterCategory('geometrija', event)">Geometrija</button>
        <button class="filter-btn" onclick="filterCategory('ostalo', event)">Ostalo</button>
    </div>

    <div id="error-msg" style="color: red; margin-bottom: 15px;"></div>

    <!-- Mreža izdelkov -->
    <div id="product-grid">Nalaganje izdelkov...</div>

    <!-- Naročilnica -->
    <div class="order-box">
        <h3>Izbrano: <span id="selected-count">0</span> / 25 kazalk</h3>
        <p>Skupni znesek: <span id="total-price">0.00</span> €</p>
        <p style="font-size: 0.9em; color: #2C3E1F;">Način plačila: Po povzetju ali preko Flik-a</p>
        
        <input type="text" id="user-name" placeholder="Vnesi svoje ime"><br>
        <input type="text" id="user-surname" placeholder="Vnesi svoj priimek"><br>
        <input type="email" id="user-email" placeholder="vnesi.svoj@gmail.com"><br>
        
        <button class="order-btn" onclick="submitOrder()">Oddaj naročilo na Email</button>
    </div>

    <script>
        // Supabase povezava (vstavi svoje podatke)
        const SUPABASE_URL = 'TUKJ_VSTAVI_SVOJ_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'TUKAJ_VSTAVI_SUPABASE_ANON_KEY';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let products = [];
        let selectedProducts = [];

        function calculatePrice(count) {
            if (count === 0) return 0;
            if (count === 1) return 7;
            if (count === 2) return 12;
            if (count === 3) return 16;
            if (count === 5) return 24;
            
            let setsOf5 = Math.floor(count / 5);
            let remainder = count % 5;
            return (setsOf5 * 24) + (remainder * 5);
        }

        async function fetchProducts() {
            try {
                const { data, error } = await _supabase.from('products').select('*');
                if (error) throw error;
                products = data;
                displayProducts(products);
            } catch (err) {
                console.error(err);
                document.getElementById('error-msg').innerText = "Napaka pri nalaganju izdelkov z baze.";
            }
        }

        function displayProducts(items) {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '';

            if (items.length === 0) {
                grid.innerHTML = '<p>Ni izdelkov v tej kategoriji.</p>';
                return;
            }

            items.forEach(product => {
                const card = document.createElement('div');
                card.className = `product-card ${selectedProducts.includes(product.id) ? 'selected' : ''}`;
                card.onclick = () => toggleSelect(product.id);

                card.innerHTML = `
                    <img src="${product.img}" alt="Kazalka">
                `;
                grid.appendChild(card);
            });
        }

        function filterCategory(category, event) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            if (category === 'vse') {
                displayProducts(products);
            } else {
                const filtered = products.filter(p => p.category === category);
                displayProducts(filtered);
            }
        }

        function toggleSelect(id) {
            const index = selectedProducts.indexOf(id);
            if (index > -1) {
                selectedProducts.splice(index, 1);
            } else {
                if (selectedProducts.length >= 25) {
                    alert("Če želite več kot 25 kazalk, me prosim pokličite na telefonsko številko: +38664172788");
                    return;
                }
                selectedProducts.items?.push ? selectedProducts.push(id) : selectedProducts.push(id);
            }
            updateOrderSummary();
            displayProducts(products);
        }

        function updateOrderSummary() {
            document.getElementById('selected-count').innerText = selectedProducts.length;
            const price = calculatePrice(selectedProducts.length);
            document.getElementById('total-price').innerText = price.toFixed(2);
        }

        function submitOrder() {
            const name = document.getElementById('user-name').value.trim();
            const surname = document.getElementById('user-surname').value.trim();
            const email = document.getElementById('user-email').value.trim();
            
            if (!name || !surname) {
                alert("Prosim, vnesi svoje ime in priimek!");
                return;
            }

            if (!email.endsWith('@gmail.com')) {
                alert("Prosimo, vnesi veljaven Gmail naslov (@gmail.com).");
                return;
            }

            if (selectedProducts.length === 0) {
                alert("Nisi izbral nobene kazalke!");
                return;
            }

            alert(`Hvala, ${name} ${surname}! Naročilo je bilo uspešno oddano na ${email}.`);
        }

        fetchProducts();
    </script>
</body>
</html>
