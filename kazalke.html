<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog 3D Kazalk - 3Dprojekti</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        html {
            scroll-behavior: smooth;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #FFF8EC;
            color: #546B41;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background-color: #546B41;
            color: white;
            padding: 10px 18px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.95rem;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
        }
        .back-btn:hover {
            background-color: #435433;
        }

        h1 {
            color: #2C3E1F;
            margin-top: 20px;
        }

        .filters {
            margin: 20px 0;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            position: sticky;
            top: 10px;
            background: #FFF8EC;
            padding: 10px;
            z-index: 100;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border-radius: 15px;
        }
        .filter-btn {
            background-color: #546B41;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
            display: inline-block;
        }
        .filter-btn:hover {
            background-color: #2C3E1F;
        }

        .category-section {
            width: 100%;
            max-width: 1000px;
            margin-bottom: 40px;
        }
        .category-title {
            color: #2C3E1F;
            border-bottom: 2px solid #546B41;
            padding-bottom: 5px;
            margin-bottom: 15px;
            font-size: 1.5rem;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            width: 100%;
        }
        .product-card {
            background: white;
            border-radius: 15px;
            padding: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            text-align: center;
            border: 3px solid transparent;
            transition: transform 0.2s, border-color 0.2s;
            position: relative;
        }
        .product-card:hover {
            transform: translateY(-3px);
        }
        .product-card.selected {
            border-color: #546B41;
            background-color: #f4f7f2;
        }
        .product-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 10px;
            cursor: pointer;
        }

        /* Gumb za izbiro posameznega izdelka */
        .select-btn {
            background-color: #546B41;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
            margin-top: 8px;
            font-weight: bold;
            width: 100%;
        }
        .select-btn:hover {
            background-color: #2C3E1F;
        }

        /* Svetlobni okenček (Lightbox) za povečavo slike čez cel zaslon */
        #lightbox {
            display: none;
            position: fixed;
            z-index: 1000;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        #lightbox img {
            max-width: 90%;
            max-height: 80vh;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(255,255,255,0.2);
        }
        #lightbox span {
            color: white;
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
        }

        .order-box {
            background: #DCCCAC;
            border: 3px solid #546B41;
            padding: 20px;
            border-radius: 20px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            text-align: center;
            margin-top: 20px;
            margin-bottom: 40px;
        }
        input[type="text"], input[type="email"] {
            width: 80%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #546B41;
            margin: 8px 0;
            background-color: white;
        }
        button.order-btn {
            background-color: #546B41;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        button.order-btn:hover {
            background-color: #2C3E1F;
        }
        .discount-info {
            background: #DCCCAC;
            border: 2px dashed #546B41;
            padding: 12px;
            border-radius: 15px;
            margin-bottom: 20px;
            max-width: 600px;
            text-align: center;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-btn">← Nazaj na glavno stran</a>

    <h1>Katalog 3D Kazalk</h1>

    <div class="discount-info">
        🏷️ <strong>Količinski popusti</strong><br>
        1x = 7,00 € &nbsp;|&nbsp; 2x = 12,00 € &nbsp;|&nbsp; 3x = 16,00 € &nbsp;|&nbsp; 5x = 24,00 €
    </div>

    <!-- Bližnjice do sekcij -->
    <div class="filters">
        <a href="#psi" class="filter-btn">Psi</a>
        <a href="#macke" class="filter-btn">Mačke</a>
        <a href="#geometrija" class="filter-btn">Geometrija</a>
        <a href="#ostalo" class="filter-btn">Ostalo</a>
    </div>

    <div id="error-msg" style="color: red; margin-bottom: 15px;"></div>

    <div id="catalog-container" style="width: 100%; max-width: 1000px;">
        Nalaganje katalogov...
    </div>

    <!-- Povečan okenček (Lightbox) za slike -->
    <div id="lightbox" onclick="closeLightbox()">
        <span onclick="closeLightbox()">&times;</span>
        <img id="lightbox-img" src="" alt="Povečana slika">
    </div>

    <!-- Naročilnica -->
    <div class="order-box">
        <h3>Izbrano: <span id="selected-count">0</span> / 25 kazalk</h3>
        <p>Skupni znesek: <span id="total-price">0.00</span> €</p>
        <p style="font-size: 0.9em; color: #2C3E1F;">Način plačila: Po povzetju ali preko Flik-a</p>
        
        <input type="text" id="user-name" placeholder="Vnesi svoje ime"><br>
        <input type="text" id="user-surname" placeholder="Vnesi svoj priimek"><br>
        <input type="email" id="user-email" placeholder="vnesi.svoj@gmail.com"><br>
        
        <button class="order-btn" onclick="submitOrder()">Oddaj naročilo na Email</button>
    </div>

    <script>
        const SUPABASE_URL = 'https://uvzphptvnscphptmvyuq.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_d9Nfy7-esxlS9_8Uxm_iYw_drUfUDky';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let products = [];
        let selectedProducts = [];

        function calculatePrice(count) {
            if (count === 0) return 0;
            if (count === 1) return 7;
            if (count === 2) return 12;
            if (count === 3) return 16;
            if (count === 5) return 24;
            
            let setsOf5 = Math.floor(count / 5);
            let remainder = count % 5;
            return (setsOf5 * 24) + (remainder * 5);
        }

        async function fetchProducts() {
            try {
                const { data, error } = await _supabase.from('products').select('*');
                if (error) throw error;
                products = data;
                renderCatalog();
            } catch (err) {
                console.error(err);
                document.getElementById('error-msg').innerText = "Napaka pri nalaganju izdelkov z baze.";
            }
        }

        function renderCatalog() {
            const container = document.getElementById('catalog-container');
            container.innerHTML = '';

            const categories = [
                { key: 'kužki', name: 'Psi', id: 'psi' },
                { key: 'mačke', name: 'Mačke', id: 'macke' },
                { key: 'geometrija', name: 'Geometrija', id: 'geometrija' },
                { key: 'ostalo', name: 'Ostalo', id: 'ostalo' }
            ];

            categories.forEach(cat => {
                // Prilagoditev, da ujame tudi alternativne zapise iz baze (npr. cats, muca itd.)
                const catProducts = products.filter(p => {
                    const c = (p.category || '').toLowerCase();
                    if (cat.key === 'kužki') return c.includes('kuž') || c.includes('psi') || c.includes('dog');
                    if (cat.key === 'mačke') return c.includes('mač') || c.includes('cat') || c.includes('muca');
                    if (cat.key === 'geometrija') return c.includes('geometr');
                    return c.includes('ostalo') || c.includes('narava') || c.includes('anime') || c.includes('ostali');
                });
                
                if (catProducts.length > 0) {
                    const section = document.createElement('div');
                    section.className = 'category-section';
                    section.id = cat.id;

                    section.innerHTML = `
                        <h2 class="category-title">${cat.name}</h2>
                        <div class="product-grid" id="grid-${cat.key}"></div>
                    `;
                    container.appendChild(section);

                    const grid = document.getElementById(`grid-${cat.key}`);
                    catProducts.forEach(product => {
                        const isSelected = selectedProducts.includes(product.id);
                        const card = document.createElement('div');
                        card.className = `product-card ${isSelected ? 'selected' : ''}`;

                        card.innerHTML = `
                            <img src="${product.img}" alt="Kazalka" onclick="openLightbox('${product.img}')" title="Klikni za povečavo">
                            <button class="select-btn" onclick="toggleSelect('${product.id}')">
                                ${isSelected ? '✓ Izbrano' : '+ Izberi'}
                            </button>
                        `;
                        grid.appendChild(card);
                    });
                }
            });
        }

        function openLightbox(imgSrc) {
            document.getElementById('lightbox-img').src = imgSrc;
            document.getElementById('lightbox').style.display = 'flex';
        }

        function closeLightbox() {
            document.getElementById('lightbox').style.display = 'none';
        }

        function toggleSelect(id) {
            const index = selectedProducts.indexOf(id);
            if (index > -1) {
                selectedProducts.splice(index, 1);
            } else {
                if (selectedProducts.length >= 25) {
                    alert("Če želite več kot 25 kazalk, me prosim pokličite na telefonsko številko: +38664172788");
                    return;
                }
                selectedProducts.push(id);
            }
            updateOrderSummary();
            renderCatalog();
        }

        function updateOrderSummary() {
            document.getElementById('selected-count').innerText = selectedProducts.length;
            const price = calculatePrice(selectedProducts.length);
            document.getElementById('total-price').innerText = price.toFixed(2);
        }

        function submitOrder() {
            const name = document.getElementById('user-name').value.trim();
            const surname = document.getElementById('user-surname').value.trim();
            const email = document.getElementById('user-email').value.trim();
            
            if (!name || !surname) {
                alert("Prosim, vnesi svoje ime in priimek!");
                return;
            }

            if (!email.endsWith('@gmail.com')) {
                alert("Prosimo, vnesi veljaven Gmail naslov (@gmail.com).");
                return;
            }

            if (selectedProducts.length === 0) {
                alert("Nisi izbral nobene kazalke!");
                return;
            }

            alert(`Hvala, ${name} ${surname}! Naročilo je bilo uspešno oddano na ${email}.`);
        }

        fetchProducts();
    </script>
</body>
</html>
