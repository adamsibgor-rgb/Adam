<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog Kazalk - 3Dprojekti</title>
    <!-- Supabase Client JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #FFF8EC;
            color: #546B41;
            margin: 0;
            padding: 20px;
        }

        .header-bar {
            text-align: center;
            margin-bottom: 25px;
        }

        .back-btn {
            display: inline-block;
            background-color: #546B41;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: bold;
            margin-bottom: 15px;
            transition: background 0.2s;
        }

        .back-btn:hover {
            background-color: #3f5230;
        }

        /* Domač in opazen cenik */
        .price-box {
            background-color: #DCCCAC;
            border: 2px dashed #546B41;
            border-radius: 15px;
            padding: 15px;
            max-width: 650px;
            margin: 0 auto 30px auto;
            text-align: center;
        }

        .price-box h3 {
            margin: 0 0 10px 0;
            color: #2C3E1F;
            font-size: 1.2rem;
        }

        .price-tags {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            font-size: 0.95rem;
            font-weight: bold;
        }

        .tag {
            background-color: #FFF8EC;
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid #546B41;
        }

        .category-nav {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .cat-btn {
            background-color: #DCCCAC;
            border: 2px solid #546B41;
            color: #546B41;
            padding: 9px 18px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
        }

        .cat-btn.active, .cat-btn:hover {
            background-color: #546B41;
            color: white;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            max-width: 1100px;
            margin: 0 auto;
        }

        .card {
            background-color: #DCCCAC;
            border: 2px solid #546B41;
            border-radius: 16px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .img-container {
            width: 100%;
            height: 200px;
            background-color: white;
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
        }

        .img-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .qty-controls {
            display: flex;
            align-items: center;
            gap: 12px;
            background-color: #FFF8EC;
            padding: 5px 12px;
            border-radius: 20px;
            border: 1px solid #546B41;
        }

        .qty-btn {
            background-color: #546B41;
            color: white;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
        }

        .qty-count {
            font-size: 1.1rem;
            font-weight: bold;
            min-width: 20px;
            text-align: center;
        }

        /* Območje za naročilo */
        .cart-summary {
            max-width: 550px;
            margin: 40px auto;
            background-color: #DCCCAC;
            border: 3px solid #546B41;
            border-radius: 20px;
            padding: 25px;
            text-align: center;
        }

        .email-input-group {
            margin: 20px 0 10px 0;
            text-align: left;
        }

        .email-input-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: #2C3E1F;
        }

        .email-input-group input {
            width: 100%;
            padding: 10px;
            border: 2px solid #546B41;
            border-radius: 10px;
            font-size: 1rem;
            box-sizing: border-box;
            background-color: #FFF8EC;
        }

        .payment-info {
            background-color: #FFF8EC;
            border: 1px solid #546B41;
            border-radius: 10px;
            padding: 8px;
            margin-bottom: 15px;
            font-weight: bold;
            color: #2C3E1F;
        }

        .send-btn {
            background-color: #546B41;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
        }

        .send-btn:hover {
            background-color: #3f5230;
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <a href="index.html" class="back-btn">← Nazaj na glavno stran</a>
        <h1>Katalog 3D Kazalk</h1>
    </div>

    <!-- Cenik -->
    <div class="price-box">
        <h3>🏷️ Količinski popusti</h3>
        <div class="price-tags">
            <div class="tag">1x = 7,00 €</div>
            <div class="tag">2x = 12,00 €</div>
            <div class="tag">3x = 15,00 €</div>
            <div class="tag">5x = 20,00 €</div>
        </div>
    </div>

    <!-- Kategorije -->
    <div class="category-nav">
        <button class="cat-btn active" onclick="filterCategory('vse')">Vse</button>
        <button class="cat-btn" onclick="filterCategory('psi')">Psi</button>
        <button class="cat-btn" onclick="filterCategory('mačke')">Mačke</button>
        <button class="cat-btn" onclick="filterCategory('ostalo')">Ostalo</button>
    </div>

    <!-- Mreža izdelkov -->
    <div class="product-grid" id="product-grid">
        <p style="text-align: center; grid-column: 1/-1;">Nalaganje izdelkov...</p>
    </div>

    <!-- Košarica -->
    <div class="cart-summary">
        <h2>Izbrano: <span id="total-qty">0</span> / 25 kazalk</h2>
        <h3>Skupni znesek: <span id="total-price">0.00</span> €</h3>
        <p id="savings-text" style="color: #2C3E1F; font-weight: bold;"></p>

        <div class="payment-info">
            📦 Način plačila: Plačilo po povzetju
        </div>

        <div class="email-input-group">
            <label for="user-email">Vnesi svoj Gmail naslov za potrditev:</label>
            <input type="email" id="user-email" placeholder="tvoje.ime@gmail.com">
        </div>

        <button class="send-btn" onclick="sendEmailOrder()">✉️ Oddaj naročilo na Email</button>
    </div>

    <script>
        const SUPABASE_URL = 'https://TVOJ-SUPABASE-ID.supabase.co'; 
        const SUPABASE_ANON_KEY = 'TVOJ-ANON-KEY';
        const PHONE_NUMBER = "040 123 456"; // Tvoja telefonska številka za večja naročila

        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let allProducts = [];
        let cart = {};

        async function fetchProducts() {
            const { data, error } = await _supabase.from('products').select('*');
            if (error) {
                console.error("Napaka:", error);
                document.getElementById('product-grid').innerHTML = '<p style="grid-column: 1/-1;">Napaka pri nalaganju izdelkov.</p>';
                return;
            }
            allProducts = data;
            renderProducts(allProducts);
        }

        function renderProducts(products) {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '';
            if (products.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center;">Ni izdelkov v tej kategoriji.</p>';
                return;
            }
            products.forEach(p => {
                const qty = cart[p.id] || 0;
                grid.innerHTML += `
                    <div class="card">
                        <div class="img-container">
                            <img src="${p.img}" alt="Kazalka" onerror="this.src='https://via.placeholder.com/200?text=Slika+ni+na+voljo'">
                        </div>
                        <div class="qty-controls">
                            <button class="qty-btn" onclick="changeQty('${p.id}', -1)">-</button>
                            <span class="qty-count" id="qty-${p.id}">${qty}</span>
                            <button class="qty-btn" onclick="changeQty('${p.id}', 1)">+</button>
                        </div>
                    </div>
                `;
            });
        }

        function filterCategory(cat) {
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            if (cat === 'vse') {
                renderProducts(allProducts);
            } else {
                const filtered = allProducts.filter(p => p.category && p.category.toLowerCase() === cat.toLowerCase());
                renderProducts(filtered);
            }
        }

        function changeQty(id, delta) {
            const currentTotal = Object.values(cart).reduce((a, b) => a + b, 0);
            
            // Omejitev na 25 kosov
            if (delta > 0 && currentTotal >= 25) {
                alert(`Za naročila večja od 25 kosov me prosim pokliči direktno na telefonsko številko:\n📞 ${PHONE_NUMBER}`);
                return;
            }

            const current = cart[id] || 0;
            const newQty = Math.max(0, current + delta);
            
            if (newQty === 0) {
                delete cart[id];
            } else {
                cart[id] = newQty;
            }
            
            const el = document.getElementById(`qty-${id}`);
            if (el) el.innerText = newQty;
            updateCartSummary();
        }

        function calculatePrice(count) {
            if (count === 0) return 0;
            let price = 0;
            let remaining = count;

            const p5 = Math.floor(remaining / 5);
            price += p5 * 20;
            remaining %= 5;

            const p3 = Math.floor(remaining / 3);
            price += p3 * 15;
            remaining %= 3;

            const p2 = Math.floor(remaining / 2);
            price += p2 * 12;
            remaining %= 2;

            price += remaining * 7;
            return price;
        }

        function updateCartSummary() {
            const totalQty = Object.values(cart).reduce((a, b) => a + b, 0);
            const totalPrice = calculatePrice(totalQty);
            const regularPrice = totalQty * 7;
            const savings = regularPrice - totalPrice;

            document.getElementById('total-qty').innerText = totalQty;
            document.getElementById('total-price').innerText = totalPrice.toFixed(2);
            
            const savingsEl = document.getElementById('savings-text');
            if (savings > 0) {
                savingsEl.innerText = `Prihranek s popustom: ${savings.toFixed(2)} €!`;
            } else {
                savingsEl.innerText = '';
            }
        }

        function sendEmailOrder() {
            const totalQty = Object.values(cart).reduce((a, b) => a + b, 0);
            if (totalQty === 0) {
                alert("Prosimo, izberite vsaj eno kazalko.");
                return;
            }

            const emailInput = document.getElementById('user-email').value.trim();
            
            // Preverjanje ali gre za veljaven Gmail naslov
            const gmailRegex = /^[a-zA-Z0-9._%+-]+@gmail\.com$/i;
            
            if (!gmailRegex.test(emailInput)) {
                const jokes = [
                    "Zakaj računalnik nima nikoli vročine? Ker ima odprta vsa okna! 💻\n\n(Prosim vnesi veljaven @gmail.com naslov za potrditev naročila.)",
                    "Zakaj se 3D tiskalnik nikoli ne skrega? Ker vedno najde pravi sloj sporazumevanja! 🖨️\n\n(Vpiši pravi Gmail naslov, da gre naročilo naprej.)",
                    "Kaj reče koda, ko naredi napako? 'To ni napaka, to je nova funkcionalnost!' 🐛\n\n(Sprejemamo le veljavne @gmail.com naslove!)"
                ];
                const randomJoke = jokes[Math.floor(Math.random() * jokes.length)];
                alert(randomJoke);
                return;
            }

            const price = calculatePrice(totalQty);
            const body = encodeURIComponent(
                `Pozdravljeni,\n\n` +
                `Oddajam naročilo za 3D kazalke.\n\n` +
                `Kupčev Gmail: ${emailInput}\n` +
                `Skupno število kazalk: ${totalQty}\n` +
                `Skupna cena: ${price.toFixed(2)} €\n` +
                `Način plačila: Plačilo po povzetju\n\n` +
                `Lep pozdrav!`
            );
            
            window.location.href = `mailto:adam.sibgor@gmail.com?subject=Naročilo Kazalk (${emailInput})&body=${body}`;
        }

        fetchProducts();
    </script>
</body>
</html>
