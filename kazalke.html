<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Kazalke | 3Dprojekti</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 0; 
            padding: 20px; 
            background-color: #fdfbf7; 
            color: #2d5a27;
            text-align: center; 
        }

        h1 { color: #2d5a27; margin-bottom: 15px; }

        /* Filtri kategorij */
        .category-filters {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .filter-btn {
            background-color: #e3d5b5;
            color: #2d5a27;
            border: 2px solid #2d5a27;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            text-transform: capitalize;
            transition: all 0.2s;
        }

        .filter-btn.active, .filter-btn:hover {
            background-color: #2d5a27;
            color: white;
        }

        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); 
            gap: 20px; 
            max-width: 900px; 
            margin: 0 auto; 
        }

        .card { 
            background-color: #e3d5b5; 
            border: 2px solid #2d5a27; 
            border-radius: 18px; 
            padding: 15px; 
            text-align: center; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .img-container {
            background-color: #ffffff;
            border-radius: 12px;
            padding: 10px;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card img { 
            max-width: 100%; 
            height: 180px; 
            object-fit: contain; 
            border-radius: 6px; 
        }

        .card h3 { 
            margin: 5px 0; 
            color: #2d5a27; 
            font-size: 1.2rem;
        }

        .card p { 
            color: #2d5a27; 
            font-weight: bold; 
            font-size: 1.1rem; 
            margin: 5px 0 12px 0; 
        }

        .btn-add { 
            background-color: #2d5a27; 
            color: white; 
            border: none; 
            padding: 10px 18px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold; 
            width: 100%;
            transition: background 0.2s;
        }

        .btn-add:hover { background-color: #1e3d1a; }

        /* Košarica */
        .cart-section { 
            max-width: 600px; 
            margin: 40px auto 0 auto; 
            background-color: #e3d5b5; 
            border: 2px solid #2d5a27; 
            border-radius: 18px; 
            padding: 20px; 
            text-align: left;
        }

        .cart-section h2 { 
            text-align: center; 
            margin-top: 0; 
            color: #2d5a27;
        }

        .cart-item { 
            display: flex; 
            justify-content: space-between; 
            padding: 8px 0; 
            border-bottom: 1px solid #c8b998; 
            color: #2d5a27;
        }

        .checkout-btn { 
            background-color: #2d5a27; 
            color: white; 
            border: none; 
            padding: 12px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 1.1em; 
            font-weight: bold;
            margin-top: 15px; 
            width: 100%; 
        }

        .checkout-btn:hover { background-color: #1e3d1a; }
    </style>
</head>
<body>

    <h1>Katalog Kazalk</h1>

    <!-- Avtomatski gumbi za kategorije -->
    <div id="category-filters" class="category-filters"></div>

    <div id="product-grid" class="grid">
        <p>Nalaganje kazalk...</p>
    </div>

    <div class="cart-section">
        <h2>Košarica</h2>
        <div id="cart-items">
            <p style="color: #666; text-align: center;">Košarica je prazna.</p>
        </div>
        <h3 style="margin-top: 15px; text-align: right; color: #2d5a27;">Skupaj: <span id="cart-total">0.00 €</span></h3>
        <button class="checkout-btn" onclick="checkout()">Zaključi nakup</button>
    </div>

    <script>
        const SUPABASE_URL = 'https://uvzphptvnscphptmvyuq.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_d9Nfy7-esxlS9_8Uxm_iYw_drUfUDky';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let allProducts = [];
        let cart = [];

        async function fetchProducts() {
            const { data, error } = await supabaseClient.from('products').select('*');
            if (error) {
                console.error('Napaka pri nalaganju:', error);
                document.getElementById('product-grid').innerHTML = '<p>Napaka pri nalaganju izdelkov.</p>';
                return;
            }
            allProducts = data;
            buildCategoryFilters();
            renderProducts(allProducts);
        }

        function buildCategoryFilters() {
            const filterContainer = document.getElementById('category-filters');
            
            // Poišče vse unikatne kategorije v bazi
            const categories = ['Vse', ...new Set(allProducts.map(p => p.category).filter(Boolean))];

            filterContainer.innerHTML = '';
            categories.forEach((cat, index) => {
                const btn = document.createElement('button');
                btn.className = `filter-btn ${index === 0 ? 'active' : ''}`;
                btn.innerText = cat;
                btn.onclick = (e) => filterCategory(cat, e.target);
                filterContainer.appendChild(btn);
            });
        }

        function filterCategory(category, btnElement) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btnElement.classList.add('active');

            if (category === 'Vse') {
                renderProducts(allProducts);
            } else {
                const filtered = allProducts.filter(p => p.category === category);
                renderProducts(filtered);
            }
        }

        function renderProducts(products) {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '';
            if (products.length === 0) {
                grid.innerHTML = '<p>Trenutno ni izdelkov v tej kategoriji.</p>';
                return;
            }
            products.forEach(p => {
                grid.innerHTML += `
                    <div class="card">
                        <div class="img-container">
                            <img src="${p.img}" alt="${p.name}" onerror="this.src='https://via.placeholder.com/200?text=Slika+ni+na+voljo'">
                        </div>
                        <h3>${p.name}</h3>
                        <p>${p.price.toFixed(2)} €</p>
                        <button class="btn-add" onclick="addToCart('${p.id}')">Dodaj v košarico</button>
                    </div>
                `;
            });
        }

        function addToCart(id) {
            const product = allProducts.find(p => p.id === id);
            if (product) {
                cart.push(product);
                updateCart();
            }
        }

        function updateCart() {
            const cartContainer = document.getElementById('cart-items');
            const totalContainer = document.getElementById('cart-total');
            if (cart.length === 0) {
                cartContainer.innerHTML = '<p style="color: #666; text-align: center;">Košarica je prazna.</p>';
                totalContainer.innerText = '0.00 €';
                return;
            }
            cartContainer.innerHTML = '';
            let total = 0;
            cart.forEach((item) => {
                total += item.price;
                cartContainer.innerHTML += `
                    <div class="cart-item">
                        <span>${item.name}</span>
                        <span><b>${item.price.toFixed(2)} €</b></span>
                    </div>
                `;
            });
            totalContainer.innerText = total.toFixed(2) + ' €';
        }

        function checkout() {
            if (cart.length === 0) {
                alert('Vaša košarica je prazna!');
                return;
            }
            alert('Hvala za naročilo!');
        }

        fetchProducts();
    </script>
</body>
</html>
